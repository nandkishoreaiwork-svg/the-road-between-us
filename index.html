<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Road Wala Radio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="scene">
  <div class="sky"></div>
  <div class="sun"></div>
  <div class="mountains"></div>
  <div class="ocean"></div>

  <div class="road">
    <div class="road-lines"></div>
    <div class="car-wrap">
      <img src="./assets/friends-coastal-highway.png" alt="Three friends driving on a coastal highway">
    </div>
  </div>

  <div class="topbar">
    <div class="brand">ROAD WALA<br><span>RADIO</span></div>
    <div class="caption">THREE FRIENDS · ONE ROAD · NO PLAN</div>
  </div>

  <div class="intro">
    <p>THE LONG WAY HOME</p>
    <h1>Windows down.<br>Music up.</h1>
    <span>Some roads become memories.</span>
  </div>

  <button class="audio-button" id="audioButton" aria-label="Open audio menu">
    <span class="speaker">♪</span>
    <span>▶ PLAY THE SONG</span>
  </button>

  <section class="audio-panel" id="audioPanel" aria-hidden="true">
    <div class="panel-head">
      <div>
        <small>ROAD RADIO 001</small>
        <h2>Khaabon Ke Parinday</h2>
        <p>Mohit Chauhan · Alyssa Mendonsa</p>
      </div>
      <button id="closeAudio">×</button>
    </div>

    <div class="art">
      <img src="./assets/friends-coastal-highway.png" alt="">
    </div>

    <audio id="audio" preload="auto" playsinline>
      <source src="./assets/khaabon-ke-parinday.mp3" type="audio/mpeg">
    </audio>

    <div class="player">
      <button id="play" class="play">▶</button>
      <div class="trackbar">
        <input id="seek" type="range" min="0" max="100" value="0">
        <div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div>
      </div>
      <button id="mute">🔊</button>
    </div>
    <div id="status">PRESS PLAY TO START</div>
  </section>

  <div class="hint"></div>
</main>
<script src="script.js"></script>
</body>
</html>
