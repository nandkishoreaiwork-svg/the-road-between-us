<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Road Wala Radio</title>
<meta name="description" content="Windows down. Music up. Road Wala Radio.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="hero">
  <img class="hero-image" src="./assets/road-wala-radio-hero.png" alt="Three friends driving beside the ocean at sunset">

  <div class="play-area">
    <button id="playButton" class="play-button" aria-label="Play Khaabon Ke Parinday">
      <span id="playIcon">▶</span>
    </button>
    <div class="play-label" id="playLabel">PLAY THE SONG</div>

    <div class="player" id="player">
      <div class="song">
        <div class="song-title">Khaabon Ke Parinday</div>
        <div class="song-artist">Mohit Chauhan · Alyssa Mendonsa</div>
      </div>
      <div class="controls">
        <button id="muteButton" aria-label="Mute or unmute">🔊</button>
        <input id="progress" type="range" min="0" max="100" value="0" aria-label="Song progress">
        <span id="time">0:00</span>
      </div>
      <div class="status" id="status">PRESS PLAY TO START</div>
    </div>
  </div>

  <audio id="audio" preload="auto" playsinline>
    <source src="./assets/khaabon-ke-parinday.mp3" type="audio/mpeg">
  </audio>
</main>

<script src="script.js"></script>
</body>
</html>
